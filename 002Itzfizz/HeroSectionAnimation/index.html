<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Welcome ItzFizz | Scroll-driven hero</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;700&family=Unbounded:wght@300;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <section class="hero">
    <!-- Road -->
    <div class="road">
      <span class="road-edge road-edge--left"></span>
      <span class="road-edge road-edge--right"></span>
      <div class="road-dashes will-move"></div>
    </div>

    <!-- Headline (letters are injected by script.js) -->
    <h1 class="headline will-move" id="headline" aria-label="Welcome ItzFizz"></h1>

    <!-- Car: outer = intro tween, inner = scroll tween -->
    <div class="car-intro will-move">
      <div class="car-scroll will-move">
        <div class="car-shadow"></div>
        <svg class="car" viewBox="0 0 200 440" role="img" aria-label="Orange sports car seen from above" xmlns="http://www.w3.org/2000/svg">
          <rect x="4" y="78" width="24" height="58" rx="8" fill="#080b0c" />
          <rect x="172" y="78" width="24" height="58" rx="8" fill="#080b0c" />
          <rect x="1" y="298" width="28" height="68" rx="9" fill="#080b0c" />
          <rect x="171" y="298" width="28" height="68" rx="9" fill="#080b0c" />
          <ellipse cx="21" cy="160" rx="10" ry="6" fill="#e85a10" />
          <ellipse cx="179" cy="160" rx="10" ry="6" fill="#e85a10" />
          <path d="M100 6 C152 6 172 40 174 92 L178 190 C180 252 178 332 169 394 C163 422 131 434 100 434 C69 434 37 422 31 394 C22 332 20 252 22 190 L26 92 C28 40 48 6 100 6 Z" fill="#ff6a1a" />
          <path d="M100 14 L100 128" stroke="#e85a10" stroke-width="3" stroke-linecap="round" />
          <path d="M33 232 C40 226 46 232 46 246 L46 280 C38 276 32 268 32 256 Z" fill="#0d1417" />
          <path d="M167 232 C160 226 154 232 154 246 L154 280 C162 276 168 268 168 256 Z" fill="#0d1417" />
          <path d="M56 152 C72 130 128 130 144 152 L150 206 L50 206 Z" fill="#0d1417" />
          <path d="M66 150 C80 140 120 140 134 150" stroke="#2c3a40" stroke-width="2" fill="none" />
          <rect x="52" y="206" width="96" height="70" rx="16" fill="#e85a10" />
          <rect x="62" y="216" width="76" height="50" rx="10" fill="#f36413" />
          <path d="M54 276 L146 276 L140 320 C120 332 80 332 60 320 Z" fill="#0d1417" />
          <path d="M42 62 C50 42 64 34 80 30 L78 46 C68 50 58 58 52 72 Z" fill="#fff4cf" />
          <path d="M158 62 C150 42 136 34 120 30 L122 46 C132 50 142 58 148 72 Z" fill="#fff4cf" />
          <rect x="42" y="408" width="34" height="7" rx="3.5" fill="#ff2e2e" />
          <rect x="124" y="408" width="34" height="7" rx="3.5" fill="#ff2e2e" />
        </svg>
      </div>
    </div>

    <!-- Stats -->
    <div class="stats">
      <div class="stat stat--1 will-move" data-side="left">
        <p class="stat-value">58%</p>
        <p class="stat-label">Increase in pick up point use</p>
      </div>
      <div class="stat stat--2 will-move" data-side="left">
        <p class="stat-value">23%</p>
        <p class="stat-label">Decreased in customer phone calls</p>
      </div>
      <div class="stat stat--3 will-move" data-side="right">
        <p class="stat-value">27%</p>
        <p class="stat-label">Increase in pick up point use</p>
      </div>
      <div class="stat stat--4 will-move" data-side="right">
        <p class="stat-value">40%</p>
        <p class="stat-label">Decreased in customer phone calls</p>
      </div>
    </div>
  </section>

  <section class="after">
    <p>The hero unpins here. Scroll back up and the car drives in reverse.</p>
  </section>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>
  <script src="script.js"></script>
</body>
</html>
